# Build and test on every push to main and every pull request.
# Releases are built by release.yml, from version tags.

name: CI

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**' ]
  pull_request:
    paths-ignore: [ '**.md', 'docs/**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Linux dependencies (file dialogs)
        run: sudo apt-get -y update && sudo apt-get -y install libglib2.0-dev libgtk-3-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      # the quick suites; dragonbones_export takes minutes in debug and runs locally
      - name: Test
        run: >
          cargo test
          --test topology --test pen --test mesh_tools --test navigation
          --test palette --test bind_pose
