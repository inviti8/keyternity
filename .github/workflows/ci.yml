# Build and test on every push to main and every pull request.
# Releases are built by release.yml, from version tags.

name: CI

on:
  push:
    branches: [ main ]
    paths-ignore: [ '**.md', 'docs/**' ]
  pull_request:
    paths-ignore: [ '**.md', 'docs/**' ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Linux dependencies (file dialogs, audio)
        run: sudo apt-get -y update && sudo apt-get -y install libglib2.0-dev libgtk-3-dev libasound2-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build

      # the quick suites; dragonbones_export takes minutes in debug and runs locally,
      # and the opt-in tests (downloads, the system's voices) are ignored
      - name: Test
        run: >
          cargo test --test all --
          topology:: pen:: mesh_tools:: navigation:: palette:: bind_pose::
          audio:: lipsync:: lipsync_langs:: transcribe:: dialog:: agent_dialog::
          face:: shapes:: layers:: layer_events::

  # the web build (trunk builds the same crate for wasm32)
  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: Swatinem/rust-cache@v2

      - name: Check (wasm32)
        run: cargo check --target wasm32-unknown-unknown
